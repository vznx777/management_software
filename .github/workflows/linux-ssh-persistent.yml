# =============================================================================
# GitHub Actions Workflow: Linux SSH Server with Persistent Backblaze B2 Volume
# File: .github/workflows/linux-ssh-persistent.yml
#
# Purpose:
#   Deploys an ephemeral SSH server on an ubuntu-latest runner, with all working
#   state persisted to a Backblaze B2 bucket. The server auto-restarts a fresh
#   run at T=350 minutes (just before the 6-hour GitHub Actions hard cap) so the
#   SSH endpoint is self-healing.
#
#   Each run gets a NEW Tailscale IP + NEW random SSH password (accepted by design).
#   Current credentials are discoverable two ways:
#     1. GitHub Actions run log → "Show Access Details" step
#     2. Backblaze B2 → <bucket>/ssh-persist/last-state.env  (use ssh-discover-creds.sh)
#
# Required GitHub Secrets:
#   TAILSCALE_AUTH_KEY  (existing)  — Tailscale node join key
#   B2_KEY_ID           (new)       — Backblaze key ID  (from Documents/backblaze.txt)
#   B2_APP_KEY          (new)       — Backblaze application key (the long secret)
#   RESTART_TOKEN       (new)       — PAT with `workflow` scope (self-restart API call)
#
# NOTE on rclone config: credentials are written to /tmp/rclone.conf (chmod 600)
#   at the start of the run. This is an EPHEMERAL GitHub runner VM — /tmp is
#   destroyed when the 6h run ends. No secrets are committed to the repo or
#   written to any persistent file. This pattern is used instead of env vars
#   to avoid sudo env-stripping when root (sudo) is needed for rclone/rsync.
# =============================================================================

name: Linux SSH Server (Persistent Volume)

on:
  workflow_dispatch:    # manual trigger + self-restart (via PAT API at T=350m)

jobs:
  ssh-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360         # 6h hard cap — GitHub Actions enforced maximum
    permissions:
      contents: read             # minimal scope
    env:
      # Backblaze B2 configuration (bucket + path — NOT secrets)
      BUCKET_NAME: "mygitbucket"
      PERSIST_PATH: "ssh-persist"   # top-level "folder" inside the bucket
      # Self-restart: wait 350 min (21,000s) before handing off to the next run.
      # ~10 min buffer before the 6h (360 min) hard cap, for the new runner to
      # boot + register its Tailscale node.
      AUTO_RESTART_AT_SECONDS: 21000
      # rclone remote name (defined in /tmp/rclone.conf, not env vars)
      RCLONE_REMOTE: "b2persistent"
      RCLONE_CONF: "/tmp/rclone.conf"

    steps:
      # =====================================================================
      # STEP 1 — Install rclone + rsync
      # =====================================================================
      - name: Install rsync and rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone rsync

      # =====================================================================
      # STEP 2 — Build a TEMPORARY rclone config from secrets (chmod 600)
      #   /tmp is destroyed when the runner VM dies (6h). No secrets are
      #   committed to the repo or persisted beyond this ephemeral run.
      # =====================================================================
      - name: Write temporary rclone config
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          sudo mkdir -p /mnt/persistent
          # Write rclone config with secrets — only readable by root (chmod 600)
          sudo tee "$RCLONE_CONF" > /dev/null <<EOF
          [b2persistent]
          type = b2
          account = $B2_KEY_ID
          key = $B2_APP_KEY
          EOF
          sudo chmod 600 "$RCLONE_CONF"
          echo "rclone config written to $RCLONE_CONF (chmod 600, ephemeral)."

      # =====================================================================
      # STEP 3 — Verify B2 connectivity (DIAGNOSTIC — never fails the job)
      # =====================================================================
      - name: Verify Backblaze B2 connectivity
        # continue-on-error so a B2 auth failure is DIAGNOSED, not fatal:
        # the SSH server still runs this cycle; fix creds for the next run.
        continue-on-error: true
        run: |
          echo "Testing rclone B2 auth + bucket access..."
          # `lsd b2persistent:` lists ALL buckets for the authed account.
          # Exit 0 = auth works. A 401 in the log = invalid B2 credentials.
          set +e
          sudo rclone --config "$RCLONE_CONF" lsd "${RCLONE_REMOTE}:" >/tmp/b2lsd.log 2>&1
          LSDEXIT=$?
          cat /tmp/b2lsd.log
          echo "rclone lsd exit code: $LSDEXIT"
          if [ $LSDEXIT -eq 0 ]; then
            if grep -q "$BUCKET_NAME" /tmp/b2lsd.log 2>/dev/null; then
              echo "✅ B2 AUTH OK — account authenticated; bucket '${BUCKET_NAME}' visible."
            else
              echo "✅ B2 AUTH OK — account authenticated (bucket '${BUCKET_NAME}' not found yet — will be created on first persist)."
            fi
          else
            echo "⚠️  B2 AUTH FAILED — exit code $LSDEXIT."
            echo "   Cause: B2_KEY_ID / B2_APP_KEY secrets are invalid, empty, or not set."
            echo "   Action: re-run 'gh secret set B2_KEY_ID' and 'gh secret set B2_APP_KEY'."
            echo "           (values from /home/vznx777/Documents/backblaze.txt)"
          fi
          echo "rclone version: $(sudo rclone version --config "$RCLONE_CONF" 2>&1 | head -1)"

      # =====================================================================
      # STEP 4 — RESTORE the persistent volume from Backblaze B2
      # =====================================================================
      - name: Restore persistent volume from B2
        run: |
          echo "Restoring from ${RCLONE_REMOTE}:${BUCKET_NAME}/${PERSIST_PATH} ..."
          # `copy` (lenient) instead of `sync`: on a first-ever run the remote
          # prefix does not exist yet, and `copy` treats an empty/missing remote
          # source as a silent no-op instead of erroring with 'directory not found'.
          # rclone output is captured to a log (kept out of the job log for clarity);
          # the real success signal is whether last-state.env came down.
          sudo rclone --config "$RCLONE_CONF" copy \
            "${RCLONE_REMOTE}:${BUCKET_NAME}/${PERSIST_PATH}" /mnt/persistent >/tmp/restore.log 2>&1 || true
          if [ -f /mnt/persistent/last-state.env ]; then
            echo "✅ Restore complete (recovered prior run state from B2)."
          else
            echo "ℹ️  No remote data found (first run or empty bucket) — starting fresh."
          fi

      # =====================================================================
      # STEP 5 — Create SSH user (FRESH random password each run — by design)
      # =====================================================================
      - name: Set up SSH user
        run: |
          sudo useradd -m -s /bin/bash sshuser || echo "sshuser already exists."
          PASSWORD=$(openssl rand -base64 12 2>/dev/null)
          echo "sshuser:$PASSWORD" | sudo chpasswd

          # Grant full passwordless sudo
          echo "sshuser ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/sshuser > /dev/null
          sudo chmod 440 /etc/sudoers.d/sshuser

          # Install + start openssh-server
          sudo apt-get install -y -qq openssh-server
          sudo service ssh start

          # Persist credentials into last-state.env (OVERWRITE — fresh each run)
          # Source of truth for "how to connect to the current run."
          sudo tee /mnt/persistent/last-state.env > /dev/null <<EOF
          RUN_ID=${GITHUB_RUN_ID}
          TAILSCALE_IP=(pending)
          RUN_PASSWORD=${PASSWORD}
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          STATUS=booting
          EOF
          echo "✅ sshuser created (password is ephemeral per-run; persisted to B2)."

      # =====================================================================
      # STEP 6 — Configure SSH for password auth (matches original workflow)
      # =====================================================================
      - name: Configure SSH Security
        run: |
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo service ssh restart

      # =====================================================================
      # STEP 7 — Install + join Tailscale (NEW node/IP every run — expected)
      # =====================================================================
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-ssh-runner-$GITHUB_RUN_ID

      - name: Get Tailscale IP + finalize credentials
        run: |
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

          # Rewrite last-state.env with the real IP (preserve password from step 5)
          sudo tee /mnt/persistent/last-state.env > /dev/null <<EOF
          RUN_ID=${GITHUB_RUN_ID}
          TAILSCALE_IP=${TS_IP}
          RUN_PASSWORD=$(sudo grep '^RUN_PASSWORD=' /mnt/persistent/last-state.env | cut -d= -f2-)
          STARTED_AT=$(sudo grep '^STARTED_AT=' /mnt/persistent/last-state.env | head -1 | cut -d= -f2-)
          STATUS=active
          EOF
          echo "✅ Tailscale IP: $TS_IP"

      - name: Configure Firewall
        run: |
          sudo ufw allow ssh
          sudo ufw --force enable

      # =====================================================================
      # STEP 8 — Attach persisted user data into the live filesystem
      # =====================================================================
      - name: Attach persistent data to sshuser workspace
        run: |
          sudo mkdir -p /opt/data /opt/scripts
          sudo rsync -a /mnt/persistent/home/sshuser/ /home/sshuser/ 2>/dev/null || true
          sudo rsync -a /mnt/persistent/data/     /opt/data/  2>/dev/null || true
          sudo rsync -a /mnt/persistent/scripts/  /opt/scripts/ 2>/dev/null || true
          sudo chown -R sshuser:sshuser /home/sshuser /opt/data /opt/scripts

      - name: Verify Sudo Access
        run: sudo -u sshuser sudo -n whoami

      # =====================================================================
      # STEP 9 — Show access details (current run credentials)
      # =====================================================================
      - name: Show Access Details
        run: |
          PASS=$(sudo grep '^RUN_PASSWORD=' /mnt/persistent/last-state.env | cut -d= -f2-)
          STARTED=$(sudo grep '^STARTED_AT=' /mnt/persistent/last-state.env | cut -d= -f2-)
          echo ""
          echo "================================= SSH ACCESS (current run) ================================"
          echo "  Connection:  ssh sshuser@${TAILSCALE_IP}"
          echo "  Password:    ${PASS}"
          echo "  Run ID:      ${GITHUB_RUN_ID}"
          echo "  Started:     ${STARTED}"
          echo "  (also persisted to B2: ${BUCKET_NAME}/${PERSIST_PATH}/last-state.env)"
          echo "  (NEW IP + password each 6h run by design.)"
          echo "=========================================================================================="
          echo ""

      # =====================================================================
      # STEP 10 — Maintain server + persist state in a loop
      #
      # Runs for AUTO_RESTART_AT_SECONDS (350 min), syncing the persistent
      # volume to B2 every 300s (5 min) — see Class-C budget note in §3 of the
      # runbook (60s cadence burns ~1400 Class C/run, exhausting B2's free 2500/day).
      # At T=350m it dispatches a NEW run via the
      # GitHub API (RESTART_TOKEN PAT), then exits — before the 6h hard cap.
      # =====================================================================
      - name: Maintain SSH Server (self-restart at T=350m)
        env:
          RESTART_TOKEN: ${{ secrets.RESTART_TOKEN }}
        run: |
          START_TS=$(date +%s)
          END_TS=$(( START_TS + AUTO_RESTART_AT_SECONDS ))
          echo "Maintaining SSH server. Auto-restart at T=+${AUTO_RESTART_AT_SECONDS}s (350 min)."

          while [ "$(date +%s)" -lt "$END_TS" ]; do
            UPTIME=$(( $(date +%s) - START_TS ))

            # Guarantee the persistent subtrees exist BEFORE rsync/rclone so a
            # missing local source can never trigger 'directory not found'
            # (fresh volume, before rsync has populated /mnt/persistent/{home,data,scripts}).
            sudo mkdir -p /mnt/persistent/home/sshuser /mnt/persistent/data /mnt/persistent/scripts \
              || echo "  ⚠️  could not pre-create /mnt/persistent subtrees"

            # Pull live sshuser data back into the persistent volume (root reads sshuser's home)
            if sudo rsync -a --delete /home/sshuser/ /mnt/persistent/home/sshuser/ >/tmp/rsync_home.log 2>&1; then
              echo "  [snapshot] /home/sshuser -> /mnt/persistent OK"
            else
              echo "  [snapshot] ⚠️  /home/sshuser rsync: $(tail -1 /tmp/rsync_home.log 2>/dev/null)"
            fi
            if sudo rsync -a --delete /opt/data/ /mnt/persistent/data/ >/tmp/rsync_data.log 2>&1; then
              echo "  [snapshot] /opt/data -> /mnt/persistent OK"
            else
              echo "  [snapshot] ⚠️  /opt/data rsync: $(tail -1 /tmp/rsync_data.log 2>/dev/null)"
            fi
            if sudo rsync -a --delete /opt/scripts/ /mnt/persistent/scripts/ >/tmp/rsync_scripts.log 2>&1; then
              echo "  [snapshot] /opt/scripts -> /mnt/persistent OK"
            else
              echo "  [snapshot] ⚠️  /opt/scripts rsync: $(tail -1 /tmp/rsync_scripts.log 2>/dev/null)"
            fi

            # Persist data dirs to B2 every 300s (5 min) (each guarded; a missing dir is
            # skipped, never a fatal 'directory not found').
            for SUB in home data scripts; do
              if [ -d "/mnt/persistent/$SUB" ]; then
                if sudo rclone --config "$RCLONE_CONF" sync "/mnt/persistent/$SUB" "${RCLONE_REMOTE}:${BUCKET_NAME}/${PERSIST_PATH}/${SUB}" >/tmp/rclone-$SUB.log 2>&1; then
                  echo "  [b2] sync/$SUB persisted OK"
                else
                  echo "  [b2] ⚠️  sync/$SUB failed: $(tail -2 /tmp/rclone-$SUB.log 2>/dev/null)"
                fi
              else
                echo "  [b2] (skip $SUB — /mnt/persistent/$SUB absent)"
              fi
            done

            # Persist the credentials file (critical path) — guard existence + report
            if [ -f /mnt/persistent/last-state.env ]; then
              if sudo rclone --config "$RCLONE_CONF" copyto /mnt/persistent/last-state.env "${RCLONE_REMOTE}:${BUCKET_NAME}/${PERSIST_PATH}/last-state.env" >/tmp/rclone-state.log 2>&1; then
                echo "  [b2] last-state.env persisted OK"
              else
                echo "  [b2] ⚠️  copyto last-state.env FAILED: $(tail -3 /tmp/rclone-state.log 2>/dev/null)"
              fi
            else
              echo "  [b2] ⚠️  last-state.env MISSING on runner — credentials NOT persisted to B2!"
            fi

            echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] SSH Server running — uptime ${UPTIME}s. State synced to B2."
            sudo tailscale status 2>/dev/null | head -3 || true
            sleep 300
          done

          # ── Self-restart: dispatch the next fresh run ──────────────
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Auto-restart threshold reached. Dispatching next run..."
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $RESTART_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/linux-ssh-persistent.yml/dispatches" \
            -d '{"ref":"main"}' || echo "000")
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Next-run dispatch HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "204" ]; then
            echo "⚠️  Dispatch did not return 204 — check RESTART_TOKEN permissions."
          fi
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Shutting down this runner. A fresh run should be starting now."

      # =====================================================================
      # STEP 11 — Final persist to B2 (runs on ANY exit: success/timeout/cancel)
      # =====================================================================
      - name: Persist state to B2 (final flush, always)
        if: always()
        run: |
          echo "Final state flush to b2://${BUCKET_NAME}/${PERSIST_PATH} ..."
          # Pre-create subtrees so rsync into them never fails on a fresh volume
          sudo mkdir -p /mnt/persistent/home/sshuser /mnt/persistent/data /mnt/persistent/scripts || true
          sudo rsync -a /home/sshuser/ /mnt/persistent/home/sshuser/ 2>/dev/null || true
          sudo rsync -a /opt/data/ /mnt/persistent/data/ 2>/dev/null || true
          sudo rsync -a /opt/scripts/ /mnt/persistent/scripts/ 2>/dev/null || true
          # Top-level copy of all persistent state (incl. last-state.env) to B2.
          # `copy` (lenient) is preferred over `sync` here: best-effort, never
          # deletes remote objects on the one-shot final flush.
          if sudo rclone --config "$RCLONE_CONF" copy /mnt/persistent "${RCLONE_REMOTE}:${BUCKET_NAME}/${PERSIST_PATH}" >/tmp/finalflush.log 2>&1; then
            echo "✅ Final flush complete. State preserved for the next run."
          else
            echo "⚠️  Final B2 flush failed: $(tail -3 /tmp/finalflush.log 2>/dev/null)"
          fi
